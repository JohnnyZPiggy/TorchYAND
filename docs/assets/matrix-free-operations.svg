<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img"><rect width="1100" height="380" fill="#f8fafc"/><text x="35" y="43" font-family="Arial" font-size="26" font-weight="bold" fill="#0f172a">Matrix-free tensor operations</text><rect x="35" y="90" width="300" height="93" rx="15" fill="#e0f2fe" stroke="#94a3b8"/><text x="53" y="123" font-family="Arial,sans-serif" font-weight="bold" font-size="19" fill="#0f172a">Returns R [T, n]</text><text x="53" y="150" font-family="Arial,sans-serif" font-size="14" fill="#334155">center: A = R - mean(R)</text><rect x="400" y="90" width="300" height="93" rx="15" fill="#e0f2fe" stroke="#94a3b8"/><text x="418" y="123" font-family="Arial,sans-serif" font-weight="bold" font-size="19" fill="#0f172a">Portfolio X [..., n]</text><text x="418" y="150" font-family="Arial,sans-serif" font-size="14" fill="#334155">project: Z = X @ A.T</text><rect x="765" y="90" width="300" height="93" rx="15" fill="#dcfce7" stroke="#94a3b8"/><text x="783" y="123" font-family="Arial,sans-serif" font-weight="bold" font-size="19" fill="#0f172a">Moment reductions</text><text x="783" y="150" font-family="Arial,sans-serif" font-size="14" fill="#334155">mean(Z^2), mean(Z^3), mean(Z^4)</text><path d="M335 135 H400 M700 135 H765" stroke="#64748b" stroke-width="3"/><text x="36" y="232" font-family="Arial" font-size="20" fill="#0f172a">Gradient: A.T @ weighted(Z) / T</text><text x="36" y="269" font-family="Arial" font-size="20" fill="#0f172a">HVP: A.T @ (weighted(Z) * (A @ v)) / T</text><text x="36" y="320" font-family="Arial" font-size="16" fill="#475569">Avoids explicit covariance, co-skewness, co-kurtosis and dense Hessian tensors.</text></svg>
